<h2 class="text-align-center">Login</h2>
<div class="app-plate">
  <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)">
    <div class="login-form">
      <div>
        <div class="form__control">
          <label for="email">Email</label>
          <input type="text" id="email" placeholder="Input text" name="email" ngModel required emailValidator
            #email="ngModel" />
           <span *ngIf="email.errors?.['required'] && (email.touched || loginForm.submitted)" class="text-danger">
            Email is required.
          </span>
          <span *ngIf="email.errors?.['invalidEmail'] && (email.touched || loginForm.submitted)" class="text-danger">
            Email is invalid.
          </span>
        </div>
        <div class="form__control">
          <label for="password">Password</label>
          <input type="password" id="password" minlength="6" placeholder="Input text" name="password" ngModel required
            #password="ngModel" />
          <span *ngIf="password.errors?.['required'] && (password.touched || loginForm.submitted)" class="text-danger">
            Password is required.
          </span>
          <span *ngIf="password.errors?.['minlength'] && (password.touched || loginForm.submitted)" class="text-danger">
            Password must be at least 6 characters.
          </span>
        </div>
      </div>
      <div>
        <div class="form__action">
          <app-button buttonText="Login"></app-button>
        </div>
        <div class="form__text">
          If you don't have an account you may <strong>Registration</strong>
        </div>
      </div>
    </div>
  </form>
</div>
