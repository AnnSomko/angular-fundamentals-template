<div class="course-card">
  <div class="course-card__description">
    <div class="course-card__description-title">{{ title }}</div>
    <div class="course-card__description-text">{{ description }}</div>
  </div>
  <div class="course-card__info">
    <div class="course-card__info-text">
      <div><b>Authors: </b>{{ authors }}</div>
      <div><b>Duration: </b><span class="course-card__duration">{{ duration | duration }}</span></div>
      <div><b>Created: </b><span class="course-card__date">{{ creationDate | customDate }}</span></div>
    </div>
    <div class="course-card__info-actions">
      
      <div class="course-card__buttons-group" *ngIf="editable">
        <app-button buttonText="Show course" (click)="showCourse.emit(id)"></app-button>

        <app-button [iconSrc]="'assets/edit-icon.svg'" (click)="editCourse.emit(id)">
        </app-button>
        <app-button [iconSrc]="'assets/delete-icon.svg'" (click)="deleteCourse.emit(id)">
        </app-button>
      </div>
    </div>
  </div>
</div>
