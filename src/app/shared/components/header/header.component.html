<div class="app-header">
  <img alt="logo" src="assets/logo.svg">
  <span *ngIf="name$ | async as name" class="username">{{ name }}</span>

  <app-button
    [buttonText]="(isAuthorized$ | async) ? 'Logout' : 'Login'"
    iconName="logout"
    type="button"
    (click)="onAuthButtonClick()">
  </app-button>
  
</div>
