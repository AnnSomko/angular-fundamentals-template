<h2 class="text-align-center">Registration</h2>
<div class="app-plate">
  <form [formGroup]="registrationForm" (ngSubmit)="onSubmit()" class="registration-form">
    <div class="registration-form">
      <div>
        <div class="form__control">
          <label for="name">Name</label>
           <input type="text" id="name" formControlName="name" placeholder="Input text" />
          <span 
            id="nameErrorMessage" 
            class="text-danger"
            *ngIf="registrationForm.get('name')?.invalid && (registrationForm.get('name')?.touched || submitted)"
          >
            Name is required.
          </span>
        </div>
        <div class="form__control">
          <label for="email">Email</label>
          <input type="email" id="email" formControlName="email" placeholder="Input text" emailValidator />
          <span id="emailErrorMessage" class="text-danger" *ngIf="registrationForm.get('email')?.invalid && (registrationForm.get('email')?.touched || submitted)">
            Email is required.
          </span>
        </div>
        <div class="form__control">
          <label for="password">Password</label>
          <input type="password" id="password" formControlName="password" placeholder="Input text" />
          <span id="passwordErrorMessage" class="text-danger" *ngIf="registrationForm.get('password')?.invalid && (registrationForm.get('password')?.touched || submitted)">
            Password is required.
          </span>
        </div>
      </div>
      <div class="form__action">
        <app-button buttonText="Login"></app-button>
      </div>
    </div>
  </form>
</div>
