<div class="course-list">
  <app-course-card *ngFor="let course of courses" [title]="course.title" [description]="course.description"
    [creationDate]="course.creationDate" [duration]="course.duration" [authors]="getAuthorNames(course.authors)"
    [editable]="editable" (clickOnShow)="onShow(course.title)">
  </app-course-card>
</div>
