<app-search 
  [placeholder]="'Search courses...'" 
  (search)="onSearch()">
</app-search>

<app-course-info
  *ngIf="(courses$ | async)?.length === 0"
  title="Your List Is Empty" 
>
<app-button 
  *ngIf="isAdmin$ | async" 
  buttonText="Add new course" 
  (click)="onAddCourse();">
</app-button>
</app-course-info>

<app-course-list
  *ngIf="(courses$ | async) as list"
  [courses]="list"
  [editable]="(isAdmin$ | async) === true"
  (showCourse)="onShow($event)"
  (editCourse)="onEdit($event)"
  (deleteCourse)="onDelete($event)">
</app-course-list>
