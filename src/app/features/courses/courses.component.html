<app-info
  *ngIf="(courses$ | async)?.length === 0"
  title="Your List Is Empty" 
>
</app-info>

<div class="courses__toolbar">
  <app-search 
    [placeholder]="'Search courses...'" 
    (search)="onSearch($event)">
</app-search>
<app-button 
  *ngIf="isAdmin$ | async" 
  buttonText="Add new course" 
  (click)="onAddCourse();">
</app-button>
</div>

<app-course-list
  *ngIf="!(isLoading$ | async) && ((courses$ | async) || []).length > 0"
  [courses]="(courses$ | async) || []"
  [editable]="(isAdmin$ | async) || false"
  (addCourse)="onAddCourse()"
  (showCourse)="onShow($event)"
  (editCourse)="onEdit($event)"
  (deleteCourse)="onDelete($event)">
</app-course-list>
